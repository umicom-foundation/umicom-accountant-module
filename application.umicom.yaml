#-----------------------------------------------------------------------------
# Umicom Accountant Module
# File: application.umicom.yaml
#
# PURPOSE:
#   Declare Umicom Accountant identity and thin-client boundaries for suite discovery.
#
# Created by: Sammy Hegab
# Organisation: Umicom Foundation
# Licence: MIT
#-----------------------------------------------------------------------------
schema: umicom.application.v1

application:
  id: org.umicom.accountant
  name: Umicom Accountant
  short_name: Accountant
  version: 0.1.0
  executable: umicom-accountant-console
  aliases: [accountant]

framework:
  minimum_version: 0.9.0
  compatible_major: 0

frontends:
  - console

entry:
  kind: workbench
  taskbar_group: finance
  pinned_by_default: false
  default_layout: bookkeeping

capabilities:
  - umicom.accounting
  - umicom.banking
  - umicom.reconciliation
  - umicom.application.experience
  - umicom.application.federation

source_layout:
  product_root: src
  composition_root: src
  console_frontend: src/console

boundaries:
  owns_reusable_framework_logic: false
  owns_persistence: false
  consumes_framework_services: true
